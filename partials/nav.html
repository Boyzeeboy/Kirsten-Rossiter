<!-- ============================================================
     SHARED MAIN NAVIGATION  (single source of truth)
     Edit this file to update the nav on every page at once.
     Injected into each page by includes.js via <div data-include="partials/nav.html">.
     ============================================================ -->
<style>
  .site-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 22px 40px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(245, 240, 232, 0.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule, rgba(160, 120, 64, 0.35)); transition: padding 0.3s;
  }
  .site-nav .nav-logo {
    font-family: var(--serif, 'Cormorant Garamond', Georgia, serif);
    font-size: 18px; font-weight: 300; letter-spacing: 0.04em;
    color: var(--ink, #1C1814); text-decoration: none; line-height: 1.2;
  }
  .site-nav .nav-logo span {
    display: block; font-size: 10px; font-family: var(--sans, 'Jost', sans-serif);
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold, #A07840); margin-top: 1px;
  }
  .nav-links { display: flex; gap: 36px; list-style: none; margin: 0; padding: 0; }
  .nav-links a {
    font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
    text-decoration: none; color: var(--ink-soft, #3d3830); transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--gold, #A07840); }
  .nav-cta {
    display: inline-block; font-family: var(--sans, 'Jost', sans-serif); font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none;
    background: var(--gold, #A07840); color: var(--cream, #F5F0E8); border: 1px solid var(--gold, #A07840);
    font-size: 10.5px; padding: 11px 22px; transition: background 0.3s, border-color 0.3s; cursor: pointer;
  }
  .nav-cta:hover { background: var(--gold-light, #c4a264); border-color: var(--gold-light, #c4a264); }

  /* Hamburger */
  .nav-hamburger {
    display: none; flex-direction: column; justify-content: center; gap: 5px;
    width: 36px; height: 36px; cursor: pointer; background: none; border: none; padding: 4px; z-index: 110;
  }
  .nav-hamburger span {
    display: block; height: 1px; background: var(--ink, #1C1814);
    transition: transform 0.35s ease, opacity 0.25s ease, width 0.25s ease; transform-origin: center;
  }
  .nav-hamburger span:nth-child(1) { width: 24px; }
  .nav-hamburger span:nth-child(2) { width: 18px; }
  .nav-hamburger span:nth-child(3) { width: 24px; }
  .nav-hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); width: 24px; }
  .nav-hamburger.open span:nth-child(2) { opacity: 0; width: 0; }
  .nav-hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); width: 24px; }

  /* Mobile drawer */
  .nav-drawer {
    display: none; position: fixed; top: 0; left: 0; right: 0;
    background: var(--cream, #F5F0E8); border-bottom: 1px solid var(--cream-deep, #e2d9c8);
    padding: 90px 40px 48px; z-index: 99; opacity: 0; transform: translateY(-16px);
    visibility: hidden; pointer-events: none;
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 0.35s;
  }
  .nav-drawer.open {
    opacity: 1; transform: translateY(0); visibility: visible; pointer-events: auto;
    box-shadow: 0 12px 40px rgba(26, 23, 20, 0.12);
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 0s;
  }
  .nav-drawer ul { list-style: none; display: flex; flex-direction: column; gap: 0; margin: 0 0 32px; padding: 0; }
  .nav-drawer ul li a {
    display: block; font-family: var(--serif, 'Cormorant Garamond', Georgia, serif); font-size: 32px; font-weight: 300;
    color: var(--ink, #1C1814); text-decoration: none; padding: 16px 0;
    border-bottom: 1px solid var(--cream-deep, #e2d9c8); letter-spacing: -0.01em;
    transition: color 0.2s, padding-left 0.2s;
  }
  .nav-drawer ul li a:hover { color: var(--gold, #A07840); padding-left: 8px; }
  .nav-drawer-cta { margin-top: 8px; }
  .nav-drawer-cta .nav-cta { width: 100%; text-align: center; display: block; }

  @media (max-width: 900px) { .nav-links { gap: 24px; } }
  @media (max-width: 640px) {
    .nav-links { display: none; }
    .site-nav > .nav-cta { display: none; }
    .nav-hamburger { display: flex; }
    .nav-drawer { display: block; }
  }
</style>

<nav class="site-nav">
  <a href="/" class="nav-logo">
    Kirsten Rossiter
    <span>Prophetic Ministries</span>
  </a>
  <ul class="nav-links">
    <li><a href="/#about">About</a></li>
    <li><a href="/#book">Book</a></li>
    <li><a href="/#insights">Insights</a></li>
    <li><a href="/building-the-nations.html">Shop</a></li>
    <li><a href="/contact.html">Contact</a></li>
  </ul>
  <a href="/#email" class="nav-cta">Subscribe</a>
  <button class="nav-hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="nav-drawer" id="navDrawer" aria-hidden="true">
  <ul>
    <li><a href="/#about">About</a></li>
    <li><a href="/#book">Book</a></li>
    <li><a href="/#insights">Insights</a></li>
    <li><a href="/building-the-nations.html">Shop</a></li>
    <li><a href="/contact.html">Contact</a></li>
  </ul>
  <div class="nav-drawer-cta">
    <a href="/#email" class="nav-cta">Subscribe</a>
  </div>
</div>
