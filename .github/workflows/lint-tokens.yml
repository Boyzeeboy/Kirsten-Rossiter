name: Lint tokens

# WHY THIS EXISTS
#
# The site consumes the token pipeline's semantic layer only — never primitives,
# never hand-written values. That rule is documented (NEW-CLIENT-PLAYBOOK.md:5,
# 37-38, 77) and was retrofitted in two passes (4492c64, c54e599), but until now
# nothing enforced it, and the failure mode is silent in both directions:
#
#   - An alias pointed at a primitive keeps working right up until the ramp is
#     renumbered under it. c98ccc6 did exactly that and moved the site's body
#     background live, unnoticed, for weeks.
#   - A var() pointing at a renamed token resolves to nothing at all. No error,
#     no fallback — the declaration just stops applying.
#
# There is a third way to break it that is quieter still. The pin in
# package.json never reaches the deployed site on its own: Cloudflare runs
# `npm install && node build-blog.js`, which installs the tokens package and then
# never reads it — the pages link the *committed* vendor/tokens.css. Bump the pin
# without running `npm run sync-tokens` and npm install succeeds, the build is
# green, CI is green, and the site quietly serves the old tokens.
#
# None of the three shows up in a build log, so it has to be a gate.
#
# `npm ci` is here for that third check only. The other three read nothing but
# repo files, so the linter stays runnable without an install and simply reports
# the sync check as skipped when the package is absent. Installing costs a git
# fetch of a tag-pinned dependency, which is the slow part of this job — worth it
# to make the pin mean something.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: semantic-only check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # kirsten-rossiter-tokens is pinned to a public GitHub tag, so no auth.
      # Needed only so the linter can compare vendor/tokens.css against it.
      - name: Install dependencies
        run: npm ci

      - name: Check token consumption
        run: npm run lint:tokens
